apiVersion: rituals.helmetica.io/v1
kind: Definition
metadata:
  name: restart
  labels:
    {{- include "<CHARTNAME>.labels" . | nindent 4 }}
spec:
  description: Restart the application
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: restart
              image: kubectl
              command: ["kubectl"]
              args: ["rollout", "restart", "deployment/{{ .Release.Name }}"]
          restartPolicy: Never
