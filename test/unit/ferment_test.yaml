suite: reagent templates
release:
  name: instance
values:
  # What the cel: expressions compute for the chart's own defaults. Helm does not
  # evaluate them, so a reagent renders as the literal string "cel: ..." without
  # this. `just values` writes it, `just test` fails when it is stale.
  - ./scenarios/default/computed.yaml
tests:
  # A snapshot pins every field of every rendered resource, so a change nobody
  # meant to make shows up as a diff. Read the diff, then take it with
  # `helm unittest -u .` once it is the change you wanted.
  - it: renders what it rendered last time
    asserts:
      - matchSnapshot: {}

  # A scenario is a second snapshot of the same templates under different values,
  # for the cases a reagent has to keep an eye on: backups off, HA on, whatever
  # this service's values turn. Write test/unit/scenarios/<name>/values.yaml with
  # the values it overrides, run `just values` to generate its computed.yaml
  # beside it, then copy this test:
  #
  # - it: renders with backups disabled
  #   values:
  #     - ./scenarios/backup-disabled/values.yaml
  #     - ./scenarios/backup-disabled/computed.yaml
  #   asserts:
  #     - matchSnapshot: {}
  #
  # Order matters: the scenario's own values first, its computed values second,
  # the same way the cluster resolves them. Use a values file rather than `set:`,
  # which reaches Helm but never the cel: expressions.
