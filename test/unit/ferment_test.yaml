suite: reagent templates
release:
  name: instance
tests:
  # What azoth renders is azoth's own business to test, down to the kinds, the gating and
  # the labels. This is here to catch the wiring coming loose: the dependency, the include,
  # and the values this chart carries reaching azoth rather than azoth's own defaults.
  - it: renders the framework's resources through azoth
    templates:
      - azoth.yaml
    set:
      backup.mode: BucketOnly
    asserts:
      - equal:
          path: spec.mode
          value: BucketOnly
        documentSelector:
          path: kind
          value: BackupPolicy

  # The arcanum is this chart's own template rather than azoth's: the mapping is the chart
  # author's to write, in the template itself, where an entry is free to turn on something
  # helm decides.
  - it: hands the service's connection details to arcana
    templates:
      - credentials.yaml
    asserts:
      - isKind:
          of: Arcanum
      - equal:
          path: metadata.name
          value: credentials
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - equal:
          path: spec.target.name
          value: instance-credentials
      # Scaffolded, the arcanum declares the secret and maps nothing into it yet.
      - notExists:
          path: spec.credentials.valueMapping

  - it: lets the chart name the credentials secret
    templates:
      - credentials.yaml
    set:
      credentials.targetSecret: instance-conn
    asserts:
      - equal:
          path: spec.target.name
          value: instance-conn

  - it: renders a ritual definition per ritual
    templates:
      - rituals/maintenance.yaml
      - rituals/restart.yaml
    asserts:
      - isKind:
          of: Definition
      - isAPIVersion:
          of: rituals.helmetica.io/v1
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: restarts the deployment of the release
    templates:
      - rituals/restart.yaml
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["rollout", "restart", "deployment/instance"]

  # The rituals are this chart's own templates, so they label themselves through azoth's
  # helper rather than getting the labels handed to them. The chart name is not pinned to a
  # value here: this file is scaffolded into a reagent as it stands, where the name is the
  # reagent's.
  - it: labels the rituals it renders
    templates:
      - rituals/maintenance.yaml
      - rituals/restart.yaml
    asserts:
      - exists:
          path: metadata.labels["helm.sh/chart"]
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/name"]
          pattern: .+
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: instance
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
