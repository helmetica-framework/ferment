apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: install
spec:
  description: >-
    Publishes the chart to the athanor registry, lets chrysopoeia turn it into a
    CRD, claims the instance from instance.yaml and checks assert.yaml against
    it. Everything else is derived from Chart.yaml, so this test needs no edits
    after a transmutation.
  steps:
    - name: claim an instance and check its workload
      use:
        template: ../shared/claim.yaml
